<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>数字あてクイズ</title>
<style>
  :root{
    --bg:#0d0b1e;
    --card:#1a1733;
    --card2:#241f47;
    --accent:#ffb830;
    --accent2:#ff5c8a;
    --blue:#4cc9f0;
    --green:#3ddc84;
    --text:#f4f1ff;
    --muted:#9a92c9;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 20% 0%, #2a1f5e 0%, transparent 45%),
                     radial-gradient(circle at 90% 90%, #3d1740 0%, transparent 40%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    min-height:100dvh;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
  }
  .screen{display:none;flex:1;flex-direction:column;padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto;}
  .screen.active{display:flex;}
  h1{font-size:34px;line-height:1.25;text-align:center;}
  .subtitle{color:var(--muted);text-align:center;margin-top:10px;font-size:15px;line-height:1.6;}
  .spacer{flex:1;}
  .btn{
    display:block;width:100%;border:none;border-radius:16px;
    padding:18px;font-size:19px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#ff8c42);
    color:#241500;margin-top:14px;
    box-shadow:0 6px 20px rgba(255,140,40,.35);
    transition:transform .08s;
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid #3a3470;}
  .btn.green{background:linear-gradient(135deg,#3ddc84,#19b567);color:#00301a;box-shadow:0 6px 20px rgba(61,220,132,.3);}
  .btn:disabled{opacity:.4;box-shadow:none;}
  .btn-link{background:none;border:none;color:var(--muted);font-size:14px;margin-top:14px;cursor:pointer;text-decoration:underline;align-self:center;}
  .logo{font-size:64px;text-align:center;margin-bottom:8px;}
  .card{background:var(--card);border-radius:20px;padding:20px;margin-top:16px;border:1px solid #2c2657;}
  label{font-size:14px;color:var(--muted);}
  .stepper{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:12px;}
  .stepper button{
    width:56px;height:56px;border-radius:50%;border:none;font-size:28px;font-weight:700;
    background:var(--card2);color:var(--accent);border:1px solid #3a3470;cursor:pointer;
  }
  .stepper button:active{transform:scale(.94);}
  .stepper .num{font-size:44px;font-weight:800;min-width:70px;text-align:center;color:var(--accent);}
  .name-list{margin-top:8px;}
  .name-list input{
    width:100%;margin-top:10px;padding:14px 16px;border-radius:12px;border:1px solid #3a3470;
    background:var(--card2);color:var(--text);font-size:17px;outline:none;
  }
  .name-list input:focus{border-color:var(--accent);}
  .mode-row{display:flex;gap:10px;margin-top:12px;}
  .mode-btn{flex:1;padding:14px 8px;border-radius:12px;border:1px solid #3a3470;background:var(--card2);color:var(--muted);font-size:16px;font-weight:700;cursor:pointer;}
  .mode-btn.selected{border-color:var(--accent);color:var(--accent);background:#2e2414;}
  .mode-desc{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6;}
  .round-badge{
    align-self:center;background:var(--card2);border:1px solid #3a3470;color:var(--blue);
    padding:6px 18px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.1em;
  }
  .cat-badge{align-self:center;margin-top:14px;background:#31255f;color:#c9baff;padding:4px 14px;border-radius:999px;font-size:13px;font-weight:700;}
  .question-text{font-size:26px;font-weight:800;line-height:1.5;text-align:center;margin-top:18px;}
  .question-small{font-size:17px;font-weight:700;line-height:1.5;text-align:center;margin-top:14px;color:var(--text);}
  .handoff-emoji{font-size:72px;text-align:center;}
  .handoff-name{font-size:32px;font-weight:800;text-align:center;color:var(--accent);margin-top:12px;}
  .handoff-note{text-align:center;color:var(--muted);margin-top:10px;font-size:15px;}
  .input-row{display:flex;align-items:center;gap:10px;margin-top:22px;}
  .input-row input{
    flex:1;padding:18px;border-radius:16px;border:2px solid #3a3470;background:var(--card2);
    color:var(--text);font-size:32px;font-weight:800;text-align:center;outline:none;min-width:0;
  }
  .input-row input:focus{border-color:var(--accent);}
  .unit{font-size:22px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .answer-big{font-size:52px;font-weight:900;text-align:center;color:var(--accent);margin-top:6px;word-break:break-all;}
  .answer-unit{font-size:22px;color:var(--muted);font-weight:700;}
  .rate-note{text-align:center;font-size:13px;color:var(--muted);margin-top:10px;}
  .rate-note b{color:var(--blue);}
  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th{font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;text-align:right;border-bottom:1px solid #2c2657;}
  th:first-child{text-align:left;}
  td{padding:11px 4px;font-size:16px;text-align:right;border-bottom:1px solid #232048;}
  td:first-child{text-align:left;font-weight:700;}
  tr.best td{color:var(--green);}
  tr.worst-guess td{color:var(--accent2);}
  .minus{color:var(--accent2);font-weight:700;}
  .score-now{font-weight:800;}
  .rank-list{margin-top:6px;}
  .rank-item{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid #232048;}
  .rank-item .medal{font-size:26px;width:36px;text-align:center;}
  .rank-item .rname{flex:1;font-size:19px;font-weight:800;}
  .rank-item .rscore{font-size:20px;font-weight:900;color:var(--blue);}
  .rank-item.first .rname,.rank-item.first .rscore{color:var(--accent);}
  .rank-item.last .rname,.rank-item.last .rscore{color:var(--accent2);}
  .drink-card{background:linear-gradient(135deg,#3d1740,#5b1b3c);border:1px solid #7c2b55;border-radius:20px;padding:22px;margin-top:18px;text-align:center;}
  .drink-title{font-size:15px;color:#ffb6d1;font-weight:700;letter-spacing:.08em;}
  .drink-loser{font-size:24px;font-weight:900;margin-top:10px;}
  .drink-count{font-size:38px;font-weight:900;margin-top:10px;color:var(--accent);line-height:1.3;}
  .drink-detail{color:#e3c9ff;font-size:14px;margin-top:10px;line-height:1.6;}
  .progress-dots{display:flex;justify-content:center;gap:8px;margin-top:16px;}
  .progress-dots span{width:10px;height:10px;border-radius:50%;background:#3a3470;}
  .progress-dots span.done{background:var(--accent);}
  .fade-in{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .center{display:flex;flex-direction:column;justify-content:center;}
</style>
</head>
<body>

<!-- ============ タイトル ============ -->
<div class="screen active center" id="screen-title">
  <div class="logo">🔢🍻</div>
  <h1>数字あてクイズ</h1>
  <p class="subtitle">3ラウンドの数字あてバトル!<br>正解から離れた分だけ点数が減る。<br>ベベは点差の分だけ飲むべし🥃</p>
  <div class="card" style="text-align:center;">
    <div style="font-size:14px;color:var(--muted);line-height:2;">
      1000点スタート / 全3問<br>
      減点は答えの桁数でスケール<br>
      点差100点につき1杯・3杯で1ウォッカ
    </div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btn-start">はじめる</button>
</div>

<!-- ============ 設定 ============ -->
<div class="screen" id="screen-setup" style="display:none" hidden>
  <h1 style="font-size:26px;">プレイヤー設定</h1>
  <div class="card">
    <label>人数(2〜8人)</label>
    <div class="stepper">
      <button id="btn-minus" type="button">−</button>
      <div class="num" id="player-count">4</div>
      <button id="btn-plus" type="button">+</button>
    </div>
  </div>
  <div class="card">
    <label>モード</label>
    <div class="mode-row">
      <button type="button" class="mode-btn selected" id="mode-normal">ノーマル</button>
      <button type="button" class="mode-btn" id="mode-unlimited">🔥アンリミテッド</button>
    </div>
    <p class="mode-desc" id="mode-desc">1問の減点は最大300点・0点より下には下がらない</p>
  </div>
  <div class="card">
    <label>名前</label>
    <div class="name-list" id="name-list"></div>
  </div>
  <div class="spacer"></div>
  <button class="btn green" id="btn-go">ゲームスタート!</button>
  <button class="btn secondary" id="btn-back-title">もどる</button>
</div>

<!-- ============ 問題発表 ============ -->
<div class="screen center" id="screen-question" style="display:none" hidden>
  <div class="round-badge" id="q-round">ROUND 1 / 3</div>
  <div class="cat-badge" id="q-cat"></div>
  <div class="question-text" id="q-text"></div>
  <div class="progress-dots" id="q-dots"></div>
  <div class="spacer"></div>
  <p class="handoff-note">全員で問題を確認してから回答スタート!</p>
  <button class="btn" id="btn-answer-start">回答スタート</button>
  <button class="btn secondary" id="btn-swap">🔀 別の問題に変える</button>
</div>

<!-- ============ 手渡し ============ -->
<div class="screen center" id="screen-handoff" style="display:none" hidden>
  <div class="handoff-emoji">📱</div>
  <div class="handoff-name" id="h-name"></div>
  <p class="handoff-note">にスマホを渡してください<br>他の人は見ないでね👀</p>
  <div class="spacer"></div>
  <button class="btn" id="btn-answer">回答する</button>
</div>

<!-- ============ 回答入力 ============ -->
<div class="screen center" id="screen-input" style="display:none" hidden>
  <div class="round-badge" id="i-player"></div>
  <div class="question-small" id="i-text"></div>
  <div class="input-row">
    <input type="text" inputmode="decimal" id="i-value" placeholder="?" autocomplete="off">
    <div class="unit" id="i-unit"></div>
  </div>
  <p class="handoff-note" id="i-error" style="color:var(--accent2);visibility:hidden;">数字を入力してね</p>
  <div class="spacer"></div>
  <button class="btn green" id="btn-submit">これで決定!</button>
  <button class="btn-link" id="btn-swap2">🔀 この問題をやめて別の問題にする(全員やり直し)</button>
</div>

<!-- ============ 結果発表 ============ -->
<div class="screen" id="screen-reveal" style="display:none" hidden>
  <div class="round-badge" id="r-round"></div>
  <div class="question-small" id="r-text" style="color:var(--muted);"></div>
  <div style="text-align:center;margin-top:16px;font-size:14px;color:var(--muted);">正解は…</div>
  <div class="answer-big" id="r-answer"></div>
  <div class="rate-note" id="r-rate"></div>
  <div class="card" style="padding:14px 16px;">
    <table>
      <thead><tr><th>プレイヤー</th><th>回答</th><th>差</th><th>減点</th><th>点数</th></tr></thead>
      <tbody id="r-table"></tbody>
    </table>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="r-next">次のラウンドへ</button>
</div>

<!-- ============ 最終結果 ============ -->
<div class="screen" id="screen-final" style="display:none" hidden>
  <h1 style="font-size:28px;">🏆 最終結果 🏆</h1>
  <div class="card rank-list" id="f-ranks"></div>
  <div class="drink-card" id="f-drink"></div>
  <div class="spacer"></div>
  <button class="btn" id="btn-rematch">同じメンバーでもう一回</button>
  <button class="btn secondary" id="btn-change">メンバー変更</button>
</div>

<script>
/* ==================== ゲームロジック ==================== */
const START_SCORE = 1000;
const ROUNDS = 3;
const MAX_PLAYERS = 8, MIN_PLAYERS = 2;
const MAX_DED = 300; // ノーマルモード:1問あたりの最大減点

/* ---- 減点レート:答えの桁数でスケール ----
   1桁:差×100 / 2桁:差×10 / 3桁:差×1 / 4桁:差×0.1 / 5桁:差×0.01 …
   ただし西暦の年号(単位が「年」で答えが1000以上)は差×1 */
function multFor(q){
  if((q.u||'').startsWith('年') && Math.abs(q.a) >= 1000){
    return {mult:1, why:'年号問題は差×1'};
  }
  const d = Math.max(1, String(Math.floor(Math.abs(q.a))).length);
  const mult = Math.pow(10, 3-d);
  const label = mult >= 1 ? String(mult) : mult.toFixed(d-3);
  return {mult, why:`答えが${d}桁なので差×${label}`};
}

let playerCount = 4;
let unlimited = false;  // アンリミテッドモード:減点上限なし・マイナス点あり
let players = [];       // {name, score}
let gameQuestions = []; // 今回の3問
let round = 0;          // 0-indexed
let answers = [];       // 現ラウンドの回答
let turn = 0;           // 現在入力中のプレイヤー

/* ---- 画面切替(インラインstyleで強制的に1画面のみ表示) ---- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
    s.style.display = 'none';
    s.setAttribute('hidden','');
  });
  const el = document.getElementById(id);
  el.classList.add('active');
  el.removeAttribute('hidden');
  el.style.display = 'flex';
  el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in');
  window.scrollTo(0,0);
}

/* ---- 設定 ---- */
function goSetup(){ renderNames(); show('screen-setup'); }
function changeCount(d){
  playerCount = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, playerCount + d));
  document.getElementById('player-count').textContent = playerCount;
  renderNames();
}
function renderNames(){
  const list = document.getElementById('name-list');
  const old = [...list.querySelectorAll('input')].map(i=>i.value);
  list.innerHTML = '';
  for(let i=0;i<playerCount;i++){
    const inp = document.createElement('input');
    inp.placeholder = `プレイヤー${i+1}`;
    inp.maxLength = 10;
    if(old[i]) inp.value = old[i];
    list.appendChild(inp);
  }
  document.getElementById('player-count').textContent = playerCount;
}
function setMode(u){
  unlimited = u;
  document.getElementById('mode-normal').classList.toggle('selected', !u);
  document.getElementById('mode-unlimited').classList.toggle('selected', u);
  document.getElementById('mode-desc').textContent = u
    ? '🔥減点に上限なし!点数はマイナスにも突入。点差が開くほど酒が深くなる危険モード'
    : '1問の減点は最大300点・0点より下には下がらない';
}

/* ---- 出題管理(同一端末での重複出題をなるべく回避) ---- */
function loadUsed(){
  try{ return new Set(JSON.parse(localStorage.getItem('numquiz_used')||'[]')); }
  catch(e){ return new Set(); }
}
function saveUsed(set){
  try{ localStorage.setItem('numquiz_used', JSON.stringify([...set])); }catch(e){}
}
function pickQuestions(){
  let used = loadUsed();
  let pool = QUESTIONS.map((q,i)=>i).filter(i=>!used.has(i));
  if(pool.length < ROUNDS){ used = new Set(); pool = QUESTIONS.map((q,i)=>i); }
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  const chosen = pool.slice(0, ROUNDS);
  chosen.forEach(i=>used.add(i));
  saveUsed(used);
  return chosen.map(i=>QUESTIONS[i]);
}
function pickOneQuestion(){
  let used = loadUsed();
  let pool = QUESTIONS.map((q,i)=>i).filter(i=>!used.has(i) && !gameQuestions.includes(QUESTIONS[i]));
  if(pool.length === 0){
    used = new Set();
    pool = QUESTIONS.map((q,i)=>i).filter(i=>!gameQuestions.includes(QUESTIONS[i]));
  }
  if(pool.length === 0) return null;
  const idx = pool[Math.floor(Math.random()*pool.length)];
  used.add(idx);
  saveUsed(used);
  return QUESTIONS[idx];
}
/* ---- 問題の切り替え(スキップ) ---- */
function swapQuestion(){
  const nq = pickOneQuestion();
  if(!nq) return;
  gameQuestions[round] = nq;
  startRound(); // 回答をリセットして新しい問題を表示
}

/* ---- ゲーム開始 ---- */
function startGame(){
  const inputs = [...document.querySelectorAll('#name-list input')];
  players = inputs.map((inp,i)=>({ name: inp.value.trim() || `プレイヤー${i+1}`, score: START_SCORE }));
  gameQuestions = pickQuestions();
  round = 0;
  startRound();
}
function rematch(){
  players.forEach(p=>p.score = START_SCORE);
  gameQuestions = pickQuestions();
  round = 0;
  startRound();
}

/* ---- ラウンド ---- */
function startRound(){
  answers = new Array(players.length).fill(null);
  turn = 0;
  const q = gameQuestions[round];
  document.getElementById('q-round').textContent = `ROUND ${round+1} / ${ROUNDS}`;
  document.getElementById('q-cat').textContent = q.c;
  document.getElementById('q-text').textContent = q.q;
  const dots = document.getElementById('q-dots');
  dots.innerHTML = '';
  for(let i=0;i<ROUNDS;i++){
    const s = document.createElement('span');
    if(i<=round) s.classList.add('done');
    dots.appendChild(s);
  }
  show('screen-question');
}
function startAnswering(){ turn = 0; showHandoff(); }
function showHandoff(){
  document.getElementById('h-name').textContent = players[turn].name + ' さん';
  show('screen-handoff');
}
function showInput(){
  const q = gameQuestions[round];
  document.getElementById('i-player').textContent = players[turn].name + ' さんの回答';
  document.getElementById('i-text').textContent = q.q;
  document.getElementById('i-unit').textContent = q.u || '';
  const inp = document.getElementById('i-value');
  inp.value = '';
  document.getElementById('i-error').style.visibility = 'hidden';
  show('screen-input');
  setTimeout(()=>inp.focus(), 100);
}
function submitAnswer(){
  const raw = document.getElementById('i-value').value.trim().replace(/[０-９．]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/,/g,'');
  const v = parseFloat(raw);
  if(raw === '' || isNaN(v)){
    document.getElementById('i-error').style.visibility = 'visible';
    return;
  }
  answers[turn] = v;
  document.getElementById('i-value').blur();
  turn++;
  if(turn < players.length){ showHandoff(); }
  else{ showReveal(); }
}

/* ---- ラウンド結果 ---- */
function fmt(n){
  return Number.isInteger(n) ? n.toLocaleString('ja-JP') : n.toLocaleString('ja-JP',{maximumFractionDigits:2});
}
function showReveal(){
  const q = gameQuestions[round];
  document.getElementById('r-round').textContent = `ROUND ${round+1} の結果`;
  document.getElementById('r-text').textContent = q.q;
  document.getElementById('r-answer').innerHTML = `${fmt(q.a)}<span class="answer-unit"> ${q.u||''}</span>`;

  // 減点計算:桁数スケール×差。ノーマル=上限300点&0点下限 / アンリミテッド=上限なし&マイナスあり
  const rate = multFor(q);
  document.getElementById('r-rate').innerHTML = unlimited
    ? `減点レート:<b>${escapeHtml(rate.why)}</b> 🔥上限なし・マイナスあり`
    : `減点レート:<b>${escapeHtml(rate.why)}</b> ※1問最大-${MAX_DED}点`;
  const rows = players.map((p,i)=>{
    const diff = Math.abs(answers[i] - q.a);
    let ded = Math.round(diff * rate.mult);
    if(!unlimited) ded = Math.min(MAX_DED, ded);
    return {i, name:p.name, ans:answers[i], diff, ded};
  });
  const sorted = [...rows].sort((a,b)=>a.diff-b.diff);
  const bestDiff = sorted[0].diff;
  const worstDiff = sorted[sorted.length-1].diff;

  rows.forEach(r=>{
    const next = players[r.i].score - r.ded;
    players[r.i].score = unlimited ? next : Math.max(0, next);
  });

  const tbody = document.getElementById('r-table');
  tbody.innerHTML = '';
  sorted.forEach(r=>{
    const tr = document.createElement('tr');
    if(r.diff === bestDiff) tr.classList.add('best');
    else if(r.diff === worstDiff && worstDiff !== bestDiff) tr.classList.add('worst-guess');
    const mark = r.diff === 0 ? '🎯' : (r.diff === bestDiff ? '👑' : '');
    tr.innerHTML = `<td>${mark}${escapeHtml(r.name)}</td><td>${fmt(r.ans)}</td><td>${fmt(Math.round(r.diff*100)/100)}</td><td class="minus">-${fmt(r.ded)}</td><td class="score-now">${fmt(players[r.i].score)}</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('r-next').textContent = (round === ROUNDS-1) ? '最終結果発表へ!' : '次のラウンドへ';
  show('screen-reveal');
}
function nextRound(){
  round++;
  if(round < ROUNDS){ startRound(); }
  else{ showFinal(); }
}

/* ---- 最終結果 & お酒カウント ---- */
function drinkText(pointDiff){
  const cups = Math.ceil(pointDiff / 100);       // 100点につき1杯(切り上げ)
  const vodka = Math.floor(cups / 3);            // 3杯 = 1ウォッカ
  const rest = cups % 3;
  let parts = [];
  if(vodka > 0) parts.push(`${vodka}ウォッカ`);
  if(rest > 0) parts.push(`${rest}杯`);
  if(parts.length === 0) return {cups, label:'0杯'};
  return {cups, label:parts.join(' と ')};
}
function showFinal(){
  const ranked = [...players].map((p,i)=>({...p})).sort((a,b)=>b.score-a.score);
  const medals = ['🥇','🥈','🥉','4','5','6','7','8'];
  const wrap = document.getElementById('f-ranks');
  wrap.innerHTML = '';
  const topScore = ranked[0].score;
  const lastScore = ranked[ranked.length-1].score;
  ranked.forEach((p,idx)=>{
    const div = document.createElement('div');
    div.className = 'rank-item' + (p.score===topScore ? ' first' : (p.score===lastScore ? ' last' : ''));
    const medal = idx < 3 ? medals[idx] : `${idx+1}位`;
    div.innerHTML = `<div class="medal">${medal}</div><div class="rname">${escapeHtml(p.name)}${p.score===lastScore && topScore!==lastScore ? ' 💀' : ''}</div><div class="rscore">${fmt(p.score)}点</div>`;
    wrap.appendChild(div);
  });

  const drinkCard = document.getElementById('f-drink');
  const winners = ranked.filter(p=>p.score===topScore).map(p=>p.name);
  const losers = ranked.filter(p=>p.score===lastScore).map(p=>p.name);
  const diff = topScore - lastScore;
  if(diff === 0){
    drinkCard.innerHTML = `<div class="drink-title">🍻 DRINK TIME 🍻</div>
      <div class="drink-count">全員同点!</div>
      <div class="drink-detail">奇跡の引き分け。全員で乾杯🍻</div>`;
  }else{
    const d = drinkText(diff);
    drinkCard.innerHTML = `<div class="drink-title">🍻 DRINK TIME 🍻</div>
      <div class="drink-loser">ベベ:${losers.map(escapeHtml).join('、')}</div>
      <div class="drink-count">${d.label}</div>
      <div class="drink-detail">トップ(${winners.map(escapeHtml).join('、')})との点差 ${fmt(diff)}点<br>100点につき1杯(切り上げ)で ${d.cups}杯 → 3杯ごとに1ウォッカ換算${unlimited ? '<br>🔥アンリミテッドモード' : ''}</div>`;
  }
  show('screen-final');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
